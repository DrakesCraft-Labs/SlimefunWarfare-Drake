<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">SlimefunWarfare Drake</title>
  <desc id="desc">Military Slimefun technology secured for DrakesCraft.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07140f"/><stop offset=".55" stop-color="#13271d"/><stop offset="1" stop-color="#2a1838"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#7fe0a5"/><stop offset=".5" stop-color="#e8c65b"/><stop offset="1" stop-color="#b88cff"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0v42" fill="none" stroke="#7fe0a5" stroke-opacity=".08"/></pattern>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <path d="M58 226h250l55-105 64 137 62-85h178" fill="none" stroke="url(#metal)" stroke-width="5" filter="url(#glow)" stroke-dasharray="900" stroke-dashoffset="900">
    <animate attributeName="stroke-dashoffset" from="900" to="0" dur="2.4s" fill="freeze"/>
  </path>
  <g transform="translate(850 42)" fill="none" stroke="url(#metal)" stroke-width="7" filter="url(#glow)">
    <circle cx="105" cy="105" r="82" stroke-dasharray="22 12"><animateTransform attributeName="transform" type="rotate" from="0 105 105" to="360 105 105" dur="14s" repeatCount="indefinite"/></circle>
    <path d="M30 105h150M105 30v150M55 55l100 100M155 55 55 155"/>
    <circle cx="105" cy="105" r="24" fill="#e8c65b" fill-opacity=".18"/>
  </g>
  <text x="58" y="92" fill="#e8c65b" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">DRAKESCRAFT LABS · MINECRAFT 1.21.11</text>
  <text x="58" y="158" fill="#f3f7f4" font-family="Georgia,serif" font-size="58" font-weight="700">SlimefunWarfare</text>
  <text x="60" y="198" fill="#b9c9c0" font-family="Segoe UI,Arial,sans-serif" font-size="23">Weapons · powered armor · rare earths · protected worlds</text>
  <rect x="58" y="254" width="510" height="3" rx="2" fill="url(#metal)"><animate attributeName="width" values="180;510;180" dur="5s" repeatCount="indefinite"/></rect>
</svg>
