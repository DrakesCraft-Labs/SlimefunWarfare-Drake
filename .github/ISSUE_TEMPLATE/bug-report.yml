name: Bug report
description: Report a reproducible problem in SlimefunWarfare for DrakesCraft.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping us keep the addon stable. Remove coordinates, player data, tokens and other private information from logs before attaching them.
  - type: checkboxes
    id: checks
    attributes:
      label: Preflight
      options:
        - label: I reproduced this on Purpur 1.21.11 with the current Drake build.
          required: true
        - label: I checked that a similar issue is not already open.
          required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed result and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Craft or obtain...
        2. Use it in...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the SlimefunWarfare, Slimefun core and server versions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Attach only the relevant excerpt or a public paste URL, with secrets removed.
